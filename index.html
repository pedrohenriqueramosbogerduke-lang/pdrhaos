<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pergunta importante 👀</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #120018, #2a0845, #16001f);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 450px;
      padding: 35px 25px;
      background: rgba(15, 15, 15, 0.97);
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
      position: relative;
      z-index: 2;
    }

    .foto {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #a855f7;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(168, 85, 247, 0.35);
    }

    .emoji { font-size: 55px; margin-bottom: 5px; }

    h1 { color: #a855f7; font-size: 28px; margin: 10px 0; }

    p {
      color: #c4b5fd;
      font-size: 17px;
      margin-bottom: 30px;
    }

    .botoes {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
    }

    button {
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #nao {
      background: #a855f7;
      color: white;
    }

    #nao:hover {
      transform: scale(1.08);
      background: #7e22ce;
    }

    #sim {
      background: #2b2b2b;
      color: #e9d5ff;
      position: static;
      z-index: 10;
      transition: left 0.15s ease, top 0.15s ease;
    }

    #sim.fugindo {
      position: fixed;
    }

    .resultado {
      display: none;
      animation: aparecer 0.5s ease;
    }

    .resultado h2 {
      color: #a855f7;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .resultado p { margin-bottom: 0; }

    .coracoes {
      position: fixed;
      font-size: 30px;
      animation: subir 3s linear forwards;
      pointer-events: none;
      z-index: 20;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes subir {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 500px) {
      .card { padding: 30px 20px; }
      .foto { width: 130px; height: 130px; }
      h1 { font-size: 24px; }
      p { font-size: 16px; }
      button { padding: 14px 25px; font-size: 16px; }
    }
  </style>
</head>

    <div class="emoji">🤣🚿</div>

    <h1>A Helena toma banho?</h1>

    <p>Escolha uma opção abaixo 👇</p>

    <div class="botoes">
      <button id="nao">NÃO ✅</button>
      <button id="sim">SIM 🙄</button>
    </div>
  </div>

  <div class="card resultado" id="resultado">

    <div class="emoji">🤣🚿</div>

    <h2>EU SEMPRE SOUBE 😭</h2>

    <p>ACABOU DE ADMITIR KKKKKKK 🤣🤣🤣</p>

  </div>

  <script>
    const sim = document.getElementById("sim");
    const nao = document.getElementById("nao");
    const pergunta = document.getElementById("pergunta");
    const resultado = document.getElementById("resultado");

    function fugir() {
      const margem = 15;

      const maxX = window.innerWidth - sim.offsetWidth - margem;
      const maxY = window.innerHeight - sim.offsetHeight - margem;

      const x = margem + Math.random() * (maxX - margem);
      const y = margem + Math.random() * (maxY - margem);

      sim.classList.add("fugindo");
      sim.style.left = x + "px";
      sim.style.top = y + "px";
    }

    sim.addEventListener("mouseenter", fugir);

    sim.addEventListener("touchstart", function(event) {
      event.preventDefault();
      fugir();
    }, { passive: false });

    sim.addEventListener("click", function(event) {
      event.preventDefault();
      fugir();
    });

    nao.addEventListener("click", function() {
      pergunta.style.display = "none";
      sim.style.display = "none";
      resultado.style.display = "block";
      criarEmojis();
    });

    function criarEmojis() {
      for (let i = 0; i < 35; i++) {
        const emoji = document.createElement("div");
        emoji.className = "coracoes";

        const emojis = ["🤣", "🚿"];
        emoji.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

        emoji.style.left = Math.random() * 100 + "vw";
        emoji.style.top = (80 + Math.random() * 20) + "vh";
        emoji.style.animationDuration = (2 + Math.random() * 2) + "s";

        document.body.appendChild(emoji);

        setTimeout(function() {
          emoji.remove();
        }, 4000);
      }
    }

    window.addEventListener("load", function() {
      // Os dois botões começam lado a lado.
    });

    window.addEventListener("resize", function() {
      const rect = sim.getBoundingClientRect();

      if (
        rect.right > window.innerWidth ||
        rect.bottom > window.innerHeight ||
        rect.left < 0 ||
        rect.top < 0
      ) {
        fugir();
      }
    });
  </script>
